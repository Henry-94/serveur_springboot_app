spring.config.import=optional:file:.env[.properties]
spring.application.name=${APP_NAME:communaute-backend}
server.port=${PORT:${SERVER_PORT:8080}}
# Autorise les appareils du réseau local (notamment le téléphone Android)
server.address=0.0.0.0

# spring.datasource.url=jdbc:postgresql://<host>:<port>/<database>?prepareThreshold=0
# spring.datasource.username=<username>
# spring.datasource.password=<password>

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# -----------------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Nettoyage idempotent de l'ancienne colonne d'image de profil.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V20260818__remove_profile_image.sql

# -----------------------------------------------------------------------------
# HikariCP
# -----------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# -----------------------------------------------------------------------------
# JWT
# -----------------------------------------------------------------------------
# Valeur de secours locale pour éviter un crash si la variable d'environnement n'est pas définie.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# -----------------------------------------------------------------------------
# CORS
# -----------------------------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.com.reseausocial.group=DEBUG
spring.main.allow-bean-definition-overriding=false
spring.main.lazy-initialization=true
spring.devtools.restart.enabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
